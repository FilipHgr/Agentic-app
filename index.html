<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- Pevné přiblížení, bez posouvání stránky při dotyku; viewport-fit=cover kvůli výřezu iPhonu (#54). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Matematika</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Světlý vzhled (#52), musí sedět s PAGE_BACKGROUND v src/shared/logic/theme.ts. */
        background: #f5f5f7;
        /* Dotyk patří hře, ne posouvání nebo přibližování stránky. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Velikost a polohu nastaví src/shared/ui/viewport.ts: na telefonu volná plocha
         bez výřezu a lišty domů, jinak celé okno (#54). */
      #game {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }

      /* Skrytý prvek, ze kterého se čte výřez a lišta domů v px (#54). */
      #safe-area-probe {
        position: fixed;
        left: 0;
        top: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }

      /* Menu s výběrem her (#67) přes celé okno; po spuštění hry se skryje.
         Leží nad #game, aby dotyky i tažení prstem šly na plátno menu (#69). */
      #menu {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #menu[hidden] {
        display: none;
      }

      #game canvas,
      #menu canvas {
        display: block;
      }

      /* Kolečko nastavení pro rodiče: v pravém horním rohu obrazovky, mimo
         herní plochu. Otevře se až podržením (src/shared/ui/settingsButton.ts).
         Rozměry a poloha jsou jen výchozí, po spuštění je podle okna
         přepíše src/shared/ui/settingsGear.ts (#55). V menu je skryté (hidden),
         ukáže ho až spuštěná hra (#67). */
      #settings-button {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        right: calc(env(safe-area-inset-right, 0px) + 12px);
        z-index: 10;
        width: 76px;
        height: 76px;
        padding: 0;
        border: 0;
        background: transparent;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      #settings-button[hidden] {
        display: none;
      }

      #settings-button svg {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* Průhlednost celé skupiny, aby se zuby a tělo kolečka nepřekrývaly světleji. */
      #settings-button .gear {
        /* SETTINGS_GEAR_STYLE v src/shared/logic/theme.ts. */
        fill: #86868b;
      }

      #settings-button .progress {
        fill: none;
        stroke: #0062cc;
        stroke-linecap: round;
        /* Délku kroužku nastaví src/shared/ui/settingsGear.ts podle velikosti (#55). */
        stroke-dasharray: var(--ring-length, 182.2);
        stroke-dashoffset: var(--ring-length, 182.2);
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }

      #settings-button.is-holding .progress {
        stroke-dashoffset: 0;
        /* Musí sedět s HOLD_TO_OPEN_SETTINGS_MS v src/shared/logic/settingsGear.ts. */
        transition: stroke-dashoffset 1s linear;
      }

      /* Domeček ve hře (#68): vlevo nahoře zrcadlově ke kolečku, zpět do menu
         podržením 1 s (src/shared/ui/homeButton.ts). Polohu a velikost podle
         okna nastaví src/shared/logic/homeButton.ts a src/shared/ui/homeButton.ts. V menu je skrytý. */
      #home-button {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: calc(env(safe-area-inset-left, 0px) + 12px);
        z-index: 10;
        width: 76px;
        height: 76px;
        padding: 0;
        border: 0;
        background: transparent;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      #home-button[hidden] {
        display: none;
      }

      #home-button svg {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #home-button .house {
        /* Stejná šedá jako kolečko (SETTINGS_GEAR_STYLE v src/shared/logic/theme.ts). */
        fill: #86868b;
      }

      #home-button .progress {
        fill: none;
        stroke: #0062cc;
        stroke-linecap: round;
        stroke-dasharray: var(--ring-length, 182.2);
        stroke-dashoffset: var(--ring-length, 182.2);
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }

      #home-button.is-holding .progress {
        stroke-dashoffset: 0;
        /* Musí sedět s HOLD_TO_GO_HOME_MS v src/shared/logic/homeButton.ts. */
        transition: stroke-dashoffset 1s linear;
      }
    </style>
  </head>
  <body>
    <div id="menu"></div>
    <div id="game"></div>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <button id="settings-button" type="button" aria-label="Nastavení pro rodiče" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g class="gear-art">
          <g class="gear">
            <rect x="27" y="6" width="10" height="14" rx="2" />
            <rect x="27" y="6" width="10" height="14" rx="2" transform="rotate(45 32 32)" />
            <rect x="27" y="6" width="10" height="14" rx="2" transform="rotate(90 32 32)" />
            <rect x="27" y="6" width="10" height="14" rx="2" transform="rotate(135 32 32)" />
            <rect x="27" y="6" width="10" height="14" rx="2" transform="rotate(180 32 32)" />
            <rect x="27" y="6" width="10" height="14" rx="2" transform="rotate(225 32 32)" />
            <rect x="27" y="6" width="10" height="14" rx="2" transform="rotate(270 32 32)" />
            <rect x="27" y="6" width="10" height="14" rx="2" transform="rotate(315 32 32)" />
            <circle cx="32" cy="32" r="18" />
          </g>
          <circle cx="32" cy="32" r="8" fill="#f5f5f7" />
        </g>
        <circle class="progress" cx="32" cy="32" r="29" stroke-width="5" />
      </svg>
    </button>
    <button id="home-button" type="button" aria-label="Zpět do menu" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g class="home-art">
          <path
            class="house"
            d="M32 13 L52 30 Q53.5 31.5 51.5 32 L47 32 L47 49 Q47 51 45 51 L37 51 L37 39 L27 39 L27 51 L19 51 Q17 51 17 49 L17 32 L12.5 32 Q10.5 31.5 12 30 Z"
          />
        </g>
        <circle class="progress" cx="32" cy="32" r="29" stroke-width="5" />
      </svg>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
